spin_manifest_version = 2

[application]
authors = ["itowlson <ivan.towlson@fermyon.com>"]
description = "Read data from a POST request"
name = "xxxxxxxxxxxxxxxxxxxx"
version = "0.1.0"

[[trigger.http]]
route = "/..."
component = "read-post"

[component.read-post]
source = "dist/read-post.wasm"
exclude_files = ["**/node_modules"]
# key_value_stores = ["default"]
# sqlite_databases = ["default"]
allowed_outbound_hosts = [
    "https://raw.githubusercontent.com/",

    "https://script.google.com/",
    "https://www.googleapis.com/",

    "https://accounts.zoho.com/",
    "https://www.zohoapis.com/",
    "https://download.zoho.com/",
    "https://upload.zoho.com/",
    "https://api-console.zoho.com/",

    "https://accounts.zoho.eu/",
    "https://www.zohoapis.eu/",
    "https://download.zoho.eu/",
    "https://upload.zoho.eu/",
    "https://api-console.zoho.eu/",

    "https://accounts.zoho.com.au/",
    "https://www.zohoapis.com.au/",
    "https://download.zoho.com.au/",
    "https://upload.zoho.com.au/",
    "https://api-console.zoho.com.au/",

    "https://accounts.zoho.in/",
    "https://www.zohoapis.in/",
    "https://download.zoho.in/",
    "https://upload.zoho.in/",
    "https://api-console.zoho.in/",

    "https://accounts.zoho.jp/",
    "https://www.zohoapis.jp/",
    "https://download.zoho.jp/",
    "https://upload.zoho.jp/",
    "https://api-console.zoho.jp/",

    "https://accounts.zoho.com.cn/",
    "https://www.zohoapis.com.cn/",
    "https://download.zoho.com.cn/",
    "https://upload.zoho.com.cn/",
    "https://api-console.zoho.com.cn/",

    "https://api.pcloud.com/",
    "https://eapi.pcloud.com/",
    "https://*.pcloud.com/",

]

[component.read-post.build]
command = ["npm install", "npm run build"]
watch = ["src/**/*.ts"]